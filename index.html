<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rig lifecycle and spares intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EBE5;--panel:#F5F6F1;--ink:#13202A;--mute:#566470;--line:#C9D0C7;--hover:rgba(19,32,42,.08);--shade:rgba(19,32,42,.05);
  --man:#2B63A8;--ins:#177A60;--rep:#BE4519;--spa:#A87400;
  --s1:#2B63A8;--s2:#7BA3D1;--s3:#A7B3BE;--s4:#13202A;
  --good:#177A60;--bad:#B3261E;--warn:#A87400;
  --plate-a:#FAFBF7;--plate-b:#E3E8E0;--rivet:#98A398;
  --fd:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--fb:'Public Sans','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D151B;--panel:#15212A;--ink:#E7ECEF;--mute:#93A2AD;--line:#2A3945;--hover:rgba(231,236,239,.1);--shade:rgba(231,236,239,.05);
  --man:#6FA8EE;--ins:#4EC4A0;--rep:#F28D5F;--spa:#EBBB4B;--s1:#6FA8EE;--s2:#3E6BA0;--s3:#5F6F7B;--s4:#E7ECEF;
  --good:#4EC4A0;--bad:#FF8A80;--warn:#EBBB4B;--plate-a:#1B2A34;--plate-b:#111C24;--rivet:#3C4E5B;}}
:root[data-theme="dark"]{
  --paper:#0D151B;--panel:#15212A;--ink:#E7ECEF;--mute:#93A2AD;--line:#2A3945;--hover:rgba(231,236,239,.1);--shade:rgba(231,236,239,.05);
  --man:#6FA8EE;--ins:#4EC4A0;--rep:#F28D5F;--spa:#EBBB4B;--s1:#6FA8EE;--s2:#3E6BA0;--s3:#5F6F7B;--s4:#E7ECEF;
  --good:#4EC4A0;--bad:#FF8A80;--warn:#EBBB4B;--plate-a:#1B2A34;--plate-b:#111C24;--rivet:#3C4E5B;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--fb);font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:.005em;line-height:1.08}
h1{font-size:clamp(30px,4.2vw,50px)}
h2{font-size:clamp(22px,2.4vw,30px)}
h3{font-size:19px}
p{margin:0}
.mute{color:var(--mute)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:28px 18px 24px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.brand{font-family:var(--fd);font-weight:700;font-size:25px;line-height:1;margin-bottom:2px}
.brand small{display:block;font:500 12px/1.35 var(--fb);color:var(--mute);margin-top:6px}
.track{position:relative;margin:22px 0 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.track::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--line)}
.nv{position:relative;text-align:left;background:none;border:0;padding:9px 8px 9px 6px;border-radius:6px;color:var(--mute);font-weight:500;font-size:14px;line-height:1.25}
.nv::before{content:"";position:absolute;left:-20px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--paper);border:2px solid var(--c,var(--mute))}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv[aria-current="page"]{color:var(--ink);font-weight:600}
.nv[aria-current="page"]::before{background:var(--c,var(--ink))}
.nv small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.railfoot{margin-top:auto;font-size:12px;color:var(--mute);line-height:1.4}
/* top */
.wrap{min-width:0;padding:0 clamp(16px,3vw,40px) 64px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding:26px 0 18px;border-bottom:1px solid var(--line)}
.top .ttl{font-family:var(--fd);font-weight:600;font-size:21px}
.top .ttl small{display:block;font:400 13px var(--fb);color:var(--mute)}
.flt{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.flt label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
select{font:500 14px var(--fb);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 28px 7px 10px;min-width:150px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mute);background:var(--panel)}
main{padding-top:30px}
.sub{color:var(--mute);max-width:70ch;margin-top:10px}
section{margin-top:44px}
section:first-child{margin-top:0}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sh p{color:var(--mute);font-size:13.5px;max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.pc h3{margin-bottom:2px}.pc .cap{font-size:13px;color:var(--mute);margin-bottom:10px;max-width:60ch}
svg{display:block;max-width:100%;overflow:visible}
svg text{font-family:var(--fb)}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:11px}
.fcz{fill:var(--shade)}.fct{font-style:italic}
.hit{fill:transparent}.hit:hover{fill:var(--hover)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .08s;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.tip.on{opacity:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute);margin:0 0 8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
.leg .ln::before{height:2px;margin-bottom:3px;vertical-align:middle}
/* overview hero */
.hero h1{max-width:20ch}
.hero .sub{font-size:15.5px}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:30px}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.sg{font-family:var(--fd);font-weight:600;font-size:19px;display:flex;align-items:center;gap:10px;color:var(--c)}
.sg::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--c),transparent)}
.stage:not(:last-child) .sg::after{background:var(--c);clip-path:polygon(0 0,calc(100% - 9px) 0,calc(100% - 9px) -4px,100% 50%,calc(100% - 9px) 6px,calc(100% - 9px) 2px,0 2px)}
.snote{font-size:13px;color:var(--mute);line-height:1.45}
.plates{display:flex;flex-direction:column;gap:14px;flex:1}
/* KPI plate */
.plate{position:relative;flex:1;display:flex;flex-direction:column;gap:2px;padding:16px 18px 14px;border-radius:10px;cursor:pointer;color:var(--ink);
  background:linear-gradient(150deg,var(--plate-a),var(--plate-b));border:1px solid var(--line);
  box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line);transition:transform .15s,border-color .15s}
.plate::before,.plate::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--panel),var(--rivet));top:9px}
.plate::before{left:9px}.plate::after{right:9px}
.plate:hover{transform:translateY(-2px);border-color:var(--c)}
.plate:focus-visible{outline-color:var(--c)}
.pl-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:2px 10px 0 10px;color:var(--c);font-weight:600}
.pl-go{opacity:.0;transition:opacity .15s;font-weight:500;color:var(--mute)}.plate:hover .pl-go,.plate:focus-visible .pl-go{opacity:1}
.pl-val{font-family:var(--fd);font-weight:700;font-size:clamp(44px,4.6vw,60px);line-height:1;margin:8px 10px 0;letter-spacing:-.005em}
.pl-val small{font-size:.42em;font-weight:600;margin-left:4px;color:var(--mute)}
.pl-name{margin:2px 10px 0;font-weight:600;font-size:14px}
.pl-d{margin:2px 10px 0;font-size:13px;color:var(--mute)}
.pl-d b{font-weight:600}.up b{color:var(--good)}.dn b{color:var(--bad)}
.pl-sp{margin:8px 10px 0;height:36px}
.legend-dir{display:inline-block;margin-left:4px;font-size:11px;color:var(--mute)}
/* tables */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
input[type=search]{font:400 14px var(--fb);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:210px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13.5px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--paper);font-weight:600}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{font-weight:600;font-size:12.5px;color:var(--mute);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--paper)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}.tbl th.r{text-align:right}
.tbl tbody tr[data-act]{cursor:pointer}.tbl tbody tr[data-act]:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--shade)}
.tbl .xr td{background:var(--shade);padding:16px 14px 18px}
.tbl small{display:block;color:var(--mute);font-size:12px}
.more{margin-top:10px;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 14px;color:var(--mute)}
.st{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid currentColor}
.st.ok{color:var(--good)}.st.soon{color:var(--warn)}.st.now{color:var(--bad)}.st.excess{color:var(--mute)}.st.idle{color:var(--mute)}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.br{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:2px 0;border-radius:4px}
.br[data-act]{cursor:pointer}.br[data-act]:hover{background:var(--hover)}
.bl small{display:block;color:var(--mute);font-size:11.5px;line-height:1.2}
.bt{height:14px;background:var(--shade);border-radius:3px;overflow:hidden}.bt i{display:block;height:100%;border-radius:3px}
.bv{font-weight:600;min-width:62px;text-align:right}.bv small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.pair .bt{height:9px;margin-bottom:3px}
/* heat */
.heat{display:grid;gap:3px;font-size:12.5px}
.heat div{padding:9px 6px;text-align:center;border-radius:3px}
.heat .hh{color:var(--mute);font-weight:600;background:none;padding:4px}
.heat .hl{text-align:left;color:var(--ink);font-weight:500;background:none}
/* callouts, stat strips */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:2px solid var(--c,var(--ink));border-bottom:1px solid var(--line)}
.stat{padding:12px 16px 12px 0;margin-right:16px}
.stat b{display:block;font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.stat span{font-size:12.5px;color:var(--mute)}
.call{border-left:3px solid var(--c,var(--ink));padding:4px 0 4px 14px;color:var(--mute);font-size:14px;max-width:74ch}
.ph{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.ph .idx{font-size:13px;font-weight:600;color:var(--c)}
.ph h1{font-size:clamp(30px,3.6vw,44px);margin-top:2px}
.bar-c{height:6px;background:var(--c);width:64px;border-radius:3px;margin-bottom:12px}
.gantt{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:8px 0 4px;font-size:11.5px}
.gantt div{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px;font-size:13px}
.kv b{display:block;font-size:15px}.kv span{color:var(--mute)}
/* sliders */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 30px;margin:14px 0 6px}
.scen label{font-size:13.5px;font-weight:600;display:block}
.scen output{font-weight:600;color:var(--c)}
.scen small{display:block;color:var(--mute);font-weight:400;font-size:12px}
input[type=range]{width:100%;accent-color:var(--c,var(--spa))}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 13px;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
/* findings */
.find{display:grid;gap:0}
.fi{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.fi .n{font-family:var(--fd);font-size:34px;font-weight:700;color:var(--c);line-height:1}
.fi p{max-width:72ch}.fi b.h{display:block;font-size:16px;margin-bottom:2px}
.lnk{background:none;border:0;color:var(--c,var(--ink));font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.rec{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rec .n{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--c);line-height:1}
.rec .m{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin-top:6px}
.rec .m b{color:var(--ink);font-weight:600}
.phase{border-top:3px solid var(--c);padding-top:10px}
.phase h3{margin-bottom:6px}.phase ul{margin:0;padding-left:18px;font-size:14px}.phase li{margin:5px 0}
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 24px}
.watch div{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.watch b{font-family:var(--fd);font-size:24px;display:block;line-height:1.1}
.close p{max-width:74ch;margin-top:10px}
.close p:first-child{margin-top:0}
.foot{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);max-width:90ch}
/* responsive */
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
@media (max-width:1180px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}.stage:not(:last-child) .sg::after{clip-path:none;background:linear-gradient(90deg,var(--c),transparent)}.grid3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;z-index:10;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:12px}
  .brand{white-space:nowrap;font-size:20px}.brand small,.railfoot,.nv small{display:none}
  .track{flex-direction:row;margin:0;padding:0;gap:4px}.track::before{display:none}
  .nv{white-space:nowrap;padding:7px 10px}.nv::before{display:none}.nv[aria-current="page"]{background:var(--c,var(--ink));color:var(--paper)}
  .grid2{grid-template-columns:1fr}.fi{grid-template-columns:36px 1fr}.fi .lnk{grid-column:2}
  .br{grid-template-columns:100px minmax(0,1fr) auto}
}
@media (max-width:620px){.chain{grid-template-columns:1fr}.top{padding-top:16px}.flt select{min-width:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Lifecycle navigation"></aside>
  <div class="wrap">
    <header class="top" id="top"></header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="tip" class="tip" role="tooltip"></div>
<script>
/* ============ DATA + MODEL (synthetic, seeded) ============ */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLab=m=>MN[((m%12)+12)%12]+' '+String((2023+Math.floor(m/12))%100).padStart(2,'0');
const NM=45, HZ=12, NOW=NM-1;           // Jan 2023 .. Sep 2026 actuals, 12-month forecast
const REGIONS=['North America','Middle East','Latin America','Asia Pacific','Europe & Africa'];
const RTYPES=['Land','Jack-up','Floater'];
const PF={'North America':1,'Middle East':1.06,'Latin America':1.08,'Asia Pacific':1.04,'Europe & Africa':1.10};
const CENTER={'North America':'Houston','Middle East':'Dubai','Latin America':'Macaé','Asia Pacific':'Singapore','Europe & Africa':'Aberdeen'};
const CENTERS=['Houston','Dubai','Macaé','Singapore','Aberdeen'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261012);
const rnd=(a=0,b=1)=>a+(b-a)*R();
const pick=a=>a[Math.floor(R()*a.length)];
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const poisson=l=>{if(l>30)return Math.max(0,Math.round(l+Math.sqrt(l)*gauss()));const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1};
const hazard=x=>0.6+1.6*Math.pow(Math.min(x,1.2),2);

/* Equipment families: overhaul interval (operating hrs), consumable $/op-hr, overhaul kit $, failures per 1,000 hrs,
   unplanned repair $, repair turnaround (days), duty (share of rig hours the unit runs) */
const FAMS=[
 {id:'TD',name:'Top drives',ovh:9500,spHr:14,kit:125e3,lam:.040,rep:42e3,tat:24,duty:.70,models:['TDX-1250','HPS-1000','TDS-11'],
  modes:['Main shaft bearing wear','Gearbox damage','Pipe handler fault','Drive motor fault','Hydraulic leak'],
  parts:[['TD-1101','Washpipe packing kit',.28,1800,8],['TD-1102','Main shaft bearing set',.22,24500,26],['TD-1103','Gearbox seal kit',.18,3200,10],['TD-1104','IBOP valve actuator',.14,9800,14],['TD-1105','Link-tilt cylinder',.10,6400,12],['TD-1106','Cooling blower motor',.08,2900,9]]},
 {id:'MP',name:'Mud pumps',ovh:6500,spHr:22,kit:90e3,lam:.080,rep:28e3,tat:14,duty:.85,models:['14-P-220','12-P-160','Hex pump'],
  modes:['Fluid-end cracking','Valve & seat washout','Liner / piston wear','Pulsation dampener fault','Gear-end bearing'],
  parts:[['MP-2201','Valve & seat set',.30,950,5],['MP-2202','Liner & piston kit',.26,3100,6],['MP-2203','Fluid end module',.16,38000,30],['MP-2204','Packing set',.14,720,4],['MP-2205','Pulsation dampener bladder',.08,1300,8],['MP-2206','Gear-end bearing',.06,5200,18]]},
 {id:'DW',name:'Drawworks',ovh:14000,spHr:9,kit:170e3,lam:.020,rep:65e3,tat:35,duty:.60,models:['2,000 hp class','3,000 hp class'],

const erf=x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y};

function forecast(units,scen,s,Hn){
  const out={};FAMS.forEach(f=>out[f.id]={cons:Array(Hn).fill(0),kit:Array(Hn).fill(0),fail:Array(Hn).fill(0),kitN:Array(Hn).fill(0)});
  const next=new Map(), pr=1+scen.price, ut=1+scen.util;
  for(const u of units){const f=FAM[u.fam],o=out[u.fam];
    let a=0;for(let k=s-5;k<=s;k++)a+=u.hrs[k];const base=a/6, avgH=base*ut;
    const typH=Math.max(avgH,330*f.duty);
    const s0=.045*f.ovh, mu=f.ovh*1.015;
    let hs=u.hs[s], prev=Phi((hs-mu)/s0), nx=false;

      o.fail[h]+=f.lam*avgH/1000*hazard(x0)*f.rep*u.tm*u.pf*.35*1.07*pr;
      const sg=Math.sqrt(s0*s0+Math.pow(.32*typH*Math.sqrt(h+1),2));

      if(!nx&&cum>=.5){next.set(u.id,h);nx=true;}

}
function fcTotals(F,Hn){
  const tot=Array(Hn).fill(0),cons=Array(Hn).fill(0),kit=Array(Hn).fill(0),fail=Array(Hn).fill(0),fam={},kitN=Array(Hn).fill(0);
  FAMS.forEach(f=>{const o=F.out[f.id];fam[f.id]=o.cons.map((v,h)=>v+o.kit[h]+o.fail[h]);
    for(let h=0;h<Hn;h++){tot[h]+=fam[f.id][h];cons[h]+=o.cons[h];kit[h]+=o.kit[h];fail[h]+=o.fail[h];kitN[h]+=o.kitN[h];}});

}

const TB={};
function table(id,cols,rows,o={}){

  const q=(S.q[id]||'').toLowerCase().trim();
  if(q&&o.search)rows=rows.filter(r=>o.search(r).toLowerCase().includes(q));
  const total=rows.length,lim=S.open['lim_'+id]||o.limit||12;
  let h=`<div class="tw"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c.al||''}" data-act="sort" data-t="${id}" data-k="${c.k}" aria-sort="${so.k===c.k?(so.d>0?'ascending':'descending'):'none'}">${c.l}${so.k===c.k?(so.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(0,lim).forEach(r=>{h+=`<tr class="${o.rowCls?o.rowCls(r):''}" ${o.rowAttr?o.rowAttr(r):''}>${cols.map(c=>`<td class="${c.al||''}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`;
    if(o.expand){const e=o.expand(r);if(e)h+=`<tr class="xr"><td colspan="${cols.length}">${e}</td></tr>`;}});
  if(!total)h+=`<tr><td colspan="${cols.length}" class="mute">No rows match. Clear the search or change the filters above.</td></tr>`;

}

function kpis(){
  const A=scope(),fc=getFc(NEUTRAL),bt=getBt();
  const wo=(a,b)=>A.wos.filter(w=>w.m>=a&&w.m<=b);
  const tatN=mean(wo(33,44).map(w=>w.tat)),tatP=mean(wo(21,32).map(w=>w.tat));
  const tatS=[];for(let m=11;m<NM;m++){const x=wo(m-2,m);tatS.push(x.length?mean(x.map(w=>w.tat)):(tatS[tatS.length-1]||0));}
  const am=(a,b)=>sum(A.sp,a,b)+sum(A.rep,a,b);
  const amS=[];for(let m=11;m<NM;m++)amS.push(am(m-11,m));
  const in12=sum(A.oin,33,44),out12=sum(A.oout,33,44);
  return {A,fc,bt,tatN,tatP,tatS,amN:am(33,44),amP:am(21,32),amS,
    util3:mean([A.util[42],A.util[43],A.util[44]]),utilP:mean([A.util[30],A.util[31],A.util[32]]),
    fcTot:fc.tot.reduce((a,b)=>a+b,0),spN:sum(A.sp,33,44),spP:sum(A.sp,21,32),b2b:out12?in12/out12:0,
    bl:A.bl[44],blP:A.bl[32],actN:A.act[44],actP:A.act[32]};
}
function bathData(){
  const A=scope(),B=[0,.25,.5,.75,1,9],res={},tot={f:Array(5).fill(0),h:Array(5).fill(0)};
  FAMS.forEach(f=>res[f.id]={f:Array(5).fill(0),h:Array(5).fill(0)});
  A.units.forEach(u=>{const f=FAM[u.fam],r=res[u.fam];for(let m=0;m<NM;m++){const x=(m===0?u.hs0:u.hs[m-1])/f.ovh;let b=0;while(b<4&&x>=B[b+1])b++;
    r.f[b]+=u.fail[m];r.h[b]+=u.hrs[m];tot.f[b]+=u.fail[m];tot.h[b]+=u.hrs[m];}});
  const idx=r=>{const sf=r.f.reduce((a,b)=>a+b,0),sh=r.h.reduce((a,b)=>a+b,0),avg=sh?sf/sh:0;return r.f.map((v,i)=>(r.h[i]>600&&avg)?(v/r.h[i])/avg:null);};
  const out={all:idx(tot),fam:{}};FAMS.forEach(f=>out.fam[f.id]=idx(res[f.id]));return out;
}
function overflowStats(){
  const A=scope(),w=A.wos.filter(x=>x.m>=21),ov=w.filter(x=>x.overflow),no=w.filter(x=>!x.overflow);
  return {share:w.length?ov.length/w.length:0,extra:ov.length&&no.length?mean(ov.map(x=>x.tat))-mean(no.map(x=>x.tat)):0,n:ov.length};
}
function insights(){
  const K=kpis(),A=K.A,fc=K.fc,bt=K.bt,out=[];
  const pk=fc.tot.indexOf(Math.max(...fc.tot)),tr=fc.tot.indexOf(Math.min(...fc.tot)),kitShare=K.fcTot?fc.kit.reduce((a,b)=>a+b,0)/K.fcTot:0;
  out.push({c:'var(--spa)',go:'spares',h:'Overhaul kits drive the next year of spares demand',
    t:`Kits make up ${pct(kitShare)} of the ${fm(K.fcTot)} forecast. Demand peaks in ${mLab(NOW+1+pk)} at ${fm(fc.tot[pk])}, ${pct(fc.tot[pk]/(fc.tot[tr]||1)-1)} above the lowest month (${mLab(NOW+1+tr)}). Long-lead parts have to be ordered ahead of that peak, not at it.`});
  const near=A.units.filter(u=>u.hs[NOW]/FAM[u.fam].ovh>=.8),byF={},byR={};
  near.forEach(u=>{byF[u.fam]=(byF[u.fam]||0)+1;byR[u.region]=(byR[u.region]||0)+1;});
  const tf=Object.entries(byF).sort((a,b)=>b[1]-a[1])[0],trg=Object.entries(byR).sort((a,b)=>b[1]-a[1])[0];
  out.push({c:'var(--ins)',go:'installed',h:'A large share of the installed base is close to overhaul',

  const bd=bathData().all,lo=bd[0],hi=bd.slice(3).filter(v=>v!=null).pop(),ov=overflowStats();
  out.push({c:'var(--rep)',go:'repair',h:'Failures rise as units run past mid-life, and overflow routing adds days',
    t:`Units in their last quarter of the overhaul interval fail about ${hi&&lo?(hi/lo).toFixed(1):'several'}x as often as freshly overhauled ones. ${pct(ov.share)} of repairs were routed outside the home service centre, adding about ${Math.round(ov.extra)} days each.`});
  const sh12=A.orders.filter(x=>x.act>=33&&x.act<=44),shP=A.orders.filter(x=>x.act>=21&&x.act<=32);
  const ot=x=>x.length?x.filter(o=>o.slip<=1).length/x.length:0;
  out.push({c:'var(--man)',go:'manufacture',h:'Backlog is healthy and delivery reliability is improving',
    t:`Backlog stands at ${fb(K.bl)} (${sgn(K.blP?K.bl/K.blP-1:0)} on a year ago) with a book-to-bill of ${K.b2b.toFixed(2)}. ${pct(ot(sh12))} of shipments landed within a month of schedule, against ${pct(ot(shP))} the year before. Every shipped unit starts consuming wear parts on day one.`});
  out.push({c:'var(--spa)',go:'spares',h:'The hours-driven forecast beats a flat average',
    t:`In a six-month backtest the unit-level model missed by ${pct(bt.wape,1)} (weighted error by family and month), against ${pct(bt.base,1)} for a trailing 12-month average. The gap is widest on drawworks and top drives, where overhauls arrive in vintage waves.`});
  return out;
}

function fanData(famId,scen){
  const A=scope(),bt=getBt(),F=getFc(scen),F0=getFc(NEUTRAL);
  const hist=famId==='All'?A.sp:A.famSp[famId],f=famId==='All'?F.tot:F.fam[famId],f0=famId==='All'?F0.tot:F0.fam[famId];
  const back=24,x=[],act=[],fore=[],lo=[],hi=[],base=[],tr=[],avg=sum(hist,33,44)/12;
  for(let i=0;i<back+HZ;i++){const m=NOW-back+1+i;x.push(mLab(m));tr.push(avg/1e6);
    if(i<back){act.push(hist[m]/1e6);fore.push(i===back-1?hist[m]/1e6:null);lo.push(null);hi.push(null);base.push(null);}
    else{const h=i-back,v=f[h]/1e6,rel=Math.max(.05,bt.mape)*1.28*(1+.08*h);act.push(null);fore.push(v);lo.push(v*(1-rel));hi.push(v*(1+rel));base.push(f0[h]/1e6);}}
  return {x,act,fore,lo,hi,base,tr,back};
}

    {k:'t12',l:'Last 12 months',al:'r',f:r=>fk(r.t12)},{k:'f12',l:'Next 12 months',al:'r',f:r=>fk(r.f12)},{k:'delta',l:'Change',al:'r',f:r=>sgn(r.delta)},
    {k:'fq',l:'Forecast per month',al:'r',f:r=>q1(r.fq)+' units'},{k:'onHand',l:'On hand',al:'r',f:r=>q1(r.onHand)},{k:'rop',l:'Reorder point',al:'r',f:r=>q1(r.rop)},

  sec('Parts at full detail','Each part with its demand, forecast and stock position. Select a row to see its history and the suggested order. On-hand stock is illustrative.',`<div class="tools">${tsearch('parts','Search part numbers and names')}</div>${tbox('parts')}`);

function partDetail(r){

  return `<div class="kv"><div><span>Part</span><b>${r.desc}</b></div><div><span>Unit price</span><b>${fk(r.price)}</b></div><div><span>Lead time</span><b>${r.lt} weeks</b></div><div><span>Safety stock</span><b>${q1(r.ss)} units</b></div><div><span>Class</span><b>${r.kind==='kit'?'Overhaul kit':'Wear and failure part'}</b></div></div>

   ${recs.map((r,i)=>{const jx=(i%2?10:-10),jy=(i%3?6:-6),cx=48+(W-72)*((r.eff-.5)/3)+jx,cy=215-(r.imp-.5)*72+jy;return `<circle cx="${cx}" cy="${cy}" r="15" style="fill:${r.c};fill-opacity:.7;stroke:${r.c}" data-tip="${esc(`<b>${i+1}. ${r.t}</b><br>Impact ${r.imp} of 3, effort ${r.eff} of 3`)}"/><text x="${cx}" y="${cy+5}" text-anchor="middle" style="font:700 14px var(--fb);fill:var(--paper)">${i+1}</text>`}).join('')}</svg>`;

  <section class="close"><div class="sh"><h2>Closing remarks</h2></div>
   <p>The lifecycle view makes one point plainly: parts demand is not random. It is set by how many rigs are drilling, how many hours they run, and how much life each unit has left. Manufacturing decides when units enter the installed base, usage decides how fast they wear, and repair tells you early which ones are wearing faster than expected.</p>
